<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="func.js"></script>
</head>
<body>
    <h1>Números</h1>
    <input type="text" id="n1"/>
    <input type="text" id="n2"/>
    <input type="text" id="n3"/>

    <button onclick="mostrarMaior()">Maior</button>
    <button onclick="mostrarOrdem()">Ordem Crescente</button>

     <p id="resNum"></p>

    <h3>Palíndromo</h3>
    <input type="text" id="texto" placeholder="Digite uma palavra">
    <button onclick="verificarPalindromoUI()">Verificar</button>
    <p id="resPal"></p>

    <h3>Subconjunto</h3>
    <input type="text" id="p1" placeholder="Palavra 1">
    <input type="text" id="p2" placeholder="Palavra 2">
    <button onclick="verificarSubUI()">Verificar</button>
    <p id="resSub"></p>


    <h3>Dia da Semana</h3>
    <input type="date" id="data">
    <button onclick="mostrarDia()">Ver dia</button>
    <p id="resData"></p>

</body>
</html>
