<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formas de criar objetos</title>
</head>
<body>
<script>

    var aluno1 = new Object();
    aluno1.ra = "004984494";
    aluno1.nome = "Sofia";
    alert(`ra=${aluno1.ra} nome=${aluno1.nome}`);

    var aluno2 = {};
    aluno2.ra = "1234";
    aluno2["nome"] = "Cardoso";
    alert("ra= " + aluno2.ra + " nome= " + aluno2.nome);

    aluno2["email do aluno"] = "sofia@gmail.com";
    alert(aluno2["email do aluno"]);

    var aluno3 = {
        ra: "9487595",
        nome: "Soooo"
    };
    alert("ra= " + aluno3.ra + " nome= " + aluno3.nome );

    function Aluno(ra, nome){
        this.ra = ra;
        this.nome = nome;
        this.MostrarDados = function() {
            return "ra=" + this.ra + " nome=" + this.nome;
        }
    }

    var aluno4 = new Aluno("23333", "Car");
    alert(aluno4.MostrarDados());
    alert(aluno4.nome);

    function Aluno2(){
        this.ra;
        this.nome;

        this.setRa = function(value){
            this.ra = value;
        }
        this.getRa = function(){
            return this.ra;
        }

        this.setNome = function(value){
            this.nome = value;
        }
        this.getNome = function(){
            return this.nome;
        }
    }

    var aluno6 = new Aluno2();
    aluno6.setNome("Pedro");
    aluno6.setRa("123445");
    alert("ra=" + aluno6.getRa() + " nome=" + aluno6.getNome());

    // herança (forma antiga)
    function AlunosADS(){
        this.numLab;

        this.setNumLab = function (value){
            this.numLab = value;
        }
        this.getNumLab = function(){
            return this.numLab;
        }
    }

    AlunosADS.prototype = new Aluno();

    var aluno7 = new AlunosADS();
    aluno7.setNome = function(nome){ this.nome = nome };
    aluno7.getNome = function(){ return this.nome };
    aluno7.setRa = function(ra){ this.ra = ra };
    aluno7.getRa = function(){ return this.ra };

    aluno7.setNome("Murilo");
    aluno7.setRa("5678");
    aluno7.setNumLab(8);

    alert(aluno7.getNome() + " " + aluno7.getNumLab());

    // usando classe
    class Aluno1{
        constructor(){
            this._ra = "";
            this._nome = "";
        }
        setNome(value){
            this._nome = value;
        }
        getNome(){
            return this._nome;
        }
        setRa(value){
            this._ra = value;
        }
        getRa(){
            return this._ra;
        }
    }

    var objAluno = new Aluno1();
    objAluno.setNome("Daniel");
    objAluno.setRa("00000000");
    alert(`nome=${objAluno.getNome()} ra=${objAluno.getRa()}`);

    // herança com classe
    class AlunosADS1 extends Aluno1{
        constructor(){
            super();
            this._numLab = 0;
        }
        setNumLab(value){
            this._numLab = value;
        }
        getNumLab(){
            return this._numLab;
        }
    }

    var objAlunosADS = new AlunosADS1();
    objAlunosADS.setNome("Alunos ads");
    objAlunosADS.setRa("234");
    objAlunosADS.setNumLab(4);

    alert(`nome=${objAlunosADS.getNome()} ra=${objAlunosADS.getRa()} numlab=${objAlunosADS.getNumLab()}`);

    // cópia de objetos
    var obj1 = new Object();
    var obj2 = obj1;
    obj1.nome = "Camila";
    alert(obj2.nome);

    // classe com atributo privado
    class ContaBancaria{
        #cpf;

        constructor(nome, saldoInicial){
            this.nome = nome;
            this.saldo = saldoInicial;
        }

        setCpf(value){
            this.#cpf = value;
        }
        getCpf(){
            return this.#cpf;
        }

        getSaldo(){
            return this.saldo;
        }

        depositar(valor){
            this.saldo += valor;
            this.#registrarTransacao(valor);
        }

        #registrarTransacao(valor){
            console.log(`Deposito de R$ ${valor} realizado por ${this.nome}. Saldo: ${this.saldo}. CPF: ${this.#cpf}`);
        }
    }

    const conta = new ContaBancaria("Gustavo" , 1000);
    conta.setCpf(123);
    conta.depositar(500);

</script>
</body>
</html>
